<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢語拼音互動實驗室</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; background-color: #f8fafc; color: #334155; }
        .pinyin-display { font-family: Arial, sans-serif; }
        .neumorphic-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .dev-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; color: white; padding: 20px; z-index: 1000; max-height: 40vh; overflow-y: auto; font-family: monospace; border-top: 4px solid #f59e0b; box-shadow: 0 -10px 25px rgba(0,0,0,0.3); }
        .marker-active { background: #f59e0b !important; color: #000 !important; font-weight: bold; border-color: white !important; transform: scale(1.05); }
        .marker-done { opacity: 0.4; background: #334155; }
        button, div { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="p-3 sm:p-6">
    <div id="app" class="max-w-4xl mx-auto pb-32">
        
        <audio ref="audioPlayer" src="pinyin_elements.mp3" preload="auto" class="hidden"></audio>

        <header class="space-y-6 mb-6">
            <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                <div class="space-y-2">
                    <button @click="toggleFullAudio" :class="isFullPlaying ? 'bg-amber-600 hover:bg-amber-700' : 'bg-slate-700 hover:bg-slate-800'" class="w-full md:w-auto text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors flex items-center justify-center gap-2 active:scale-98">
                        <span>{{ isFullPlaying ? '⏸️ 暫停完整音頻' : '▶️ 播放完整聲韻母音頻' }}</span>
                    </button>
                    <div class="text-[11px] text-slate-400 leading-relaxed font-medium pl-1">
                        <p>錄音僅供參考。網頁僅供機構內部使用。</p>
                        <p>© 普通話水平測試中心版權所有。</p>
                    </div>
                </div>
                
                <div class="flex rounded-xl bg-slate-200/70 p-1 w-full md:w-auto shadow-inner">
                    <button @click="currentTab = 'initial'" :class="currentTab === 'initial' ? 'bg-white text-emerald-800 font-extrabold shadow-md' : 'text-slate-600'" class="flex-1 md:flex-none md:px-8 py-2.5 text-sm sm:text-base rounded-lg transition-all active:scale-95">
                        基礎聲母 (23)
                    </button>
                    <button @click="currentTab = 'final'" :class="currentTab === 'final' ? 'bg-white text-blue-800 font-extrabold shadow-md' : 'text-slate-600'" class="flex-1 md:flex-none md:px-8 py-2.5 text-sm sm:text-base rounded-lg transition-all active:scale-95">
                        韻母 (39)
                    </button>
                </div>
            </div>

            <h1 class="text-center text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-wider py-2">漢語拼音互動實驗室</h1>

            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-7 gap-2 text-center">
                    <button @click="goToCombination('bpmf')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95">bpmf 拼讀</button>
                    <button @click="goToCombination('dtnl')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95">dtnl 拼讀</button>
                    <button @click="goToCombination('gkh')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95">gkh 拼讀</button>
                    <button @click="goToCombination('jqx')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95">jqx 拼讀</button>
                    <button @click="goToCombination('zhchshr')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95">翹舌音拼讀</button>
                    <button @click="goToCombination('zcs')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95">平舌音拼讀</button>
                    <button @click="goToCombination('yw')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95">零聲母/yw</button>
                </div>
            </div>
        </header>

        <main class="space-y-6">
            <div v-if="currentTab === 'initial'" class="neumorphic-card p-4 sm:p-6 border border-emerald-100">
                <h2 class="text-sm sm:text-base font-bold text-emerald-700 mb-4 flex items-center">
                    <span class="mr-2">🟢</span> 點擊聲母聽發音 (共 23 個)
                </h2>
                <div v-for="(group, name) in initialsData" :key="name" class="mb-6 last:mb-0">
                    <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider pl-1">{{ name }}</p>
                    <div class="grid grid-cols-4 sm:grid-cols-6 gap-2.5 sm:gap-4">
                        <button v-for="s in group" :key="s" 
                                @click="playSound(s)"
                                class="py-3 sm:py-4 rounded-xl border bg-slate-50 text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-300 transition-all font-bold text-xl sm:text-2xl pinyin-display shadow-sm active:scale-90">
                            {{ s }}
                        </button>
                    </div>
                </div>
            </div>

            <div v-if="currentTab === 'final'" class="neumorphic-card p-4 sm:p-6 border border-blue-100">
                <h2 class="text-sm sm:text-base font-bold text-blue-700 mb-4 flex items-center">
                    <span class="mr-2">🔵</span> 點擊韻母聽發音 (共 39 個)
                </h2>
                <div v-for="(group, name) in finalsData" :key="name" class="mb-6 last:mb-0">
                    <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider pl-1">{{ name }}</p>
                    <div class="grid grid-cols-3 sm:grid-cols-5 gap-2.5 sm:gap-4">
                        <button v-for="y in group" :key="y" 
                                @click="playSound(y)"
                                class="py-3 sm:py-4 rounded-xl border bg-slate-50 text-slate-700 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 transition-all font-bold text-lg sm:text-xl pinyin-display shadow-sm active:scale-90">
                            {{ y }}
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <div v-if="devMode" class="dev-panel">
            <div class="sticky top-0 bg-[#0f172a] pb-4 mb-4 border-b border-slate-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-orange-400 font-bold text-sm">基礎元素錄音標記助手</h2>
                    <div class="space-x-2">
                        <button @click="startRecordingList" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs font-bold transition-colors">1. 生成清單</button>
                        <button @click="exportData" class="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-xs font-bold transition-colors">2. 複製數據</button>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-6 sm:grid-cols-8 gap-1 text-[10px]">
                <div v-for="(m, i) in devMarkers" :key="i" :id="'marker-' + i" class="p-1 border border-slate-700 rounded transition-all text-center" :class="{'marker-active': currentMarkerIndex === i, 'marker-done': i < currentMarkerIndex}">
                    <span class="block opacity-40">#{{ i + 1 }}</span>
                    <span class="text-xs font-bold pinyin-display">{{ m.id }}</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const audioPlayer = ref(null);
                const currentTab = ref('initial'); 
                const isFullPlaying = ref(false);
                
                const combinationUrls = {
                    bpmf: 'https://yangjingjing2019-lang.github.io/bpmf/',
                    dtnl: '填入dtnl網頁連結',
                    gkh: '填入gkh網頁連結',
                    jqx: '填入jqx網頁連結',
                    zhchshr: '填入翹舌音拼讀網頁連結',
                    zcs: '填入平舌音拼讀網頁連結',
                    yw: '填入零聲母/yw拼讀網頁連結'
                };
                
                const devMode = ref(false);
                const devMarkers = ref([]);
                const currentMarkerIndex = ref(0);
                
const timelineData = ref({
  "b": { "start": 2.35, "end": 3.04 }, "p": { "start": 4.62, "end": 5.36 }, "m": { "start": 7.08, "end": 7.83 }, "f": { "start": 9.73, "end": 10.41 }, "d": { "start": 12.85, "end": 13.58 }, "t": { "start": 15.31, "end": 16.04 }, "n": { "start": 17.9, "end": 18.66 }, "l": { "start": 20.53, "end": 21.25 }, "g": { "start": 23.44, "end": 24.1 }, "k": { "start": 25.74, "end": 26.55 }, "h": { "start": 28.26, "end": 29.01 }, "j": { "start": 30.78, "end": 31.6 }, "q": { "start": 32.7, "end": 33.63 }, "x": { "start": 34.9, "end": 35.92 }, "zh": { "start": 38.43, "end": 39.19 }, "ch": { "start": 40.67, "end": 41.54 }, "sh": { "start": 42.84, "end": 43.81 }, "r": { "start": 45.34, "end": 46.08 }, "z": { "start": 47.75, "end": 48.41 }, "c": { "start": 49.87, "end": 50.65 }, "s": { "start": 51.92, "end": 52.82 }, "y": { "start": 54.09, "end": 54.87 }, "w": { "start": 56.04, "end": 56.82 },
  "a": { "start": 60.1, "end": 60.93 }, "o": { "start": 62.41, "end": 63.27 }, "e": { "start": 64.82, "end": 65.63 }, "i": { "start": 67.1, "end": 67.95 }, "u": { "start": 69.25, "end": 70.09 }, "ü": { "start": 71.64, "end": 72.45 }, "er": { "start": 74.27, "end": 75.07 }, "ai": { "start": 77.03, "end": 77.96 }, "ei": { "start": 79.1, "end": 79.97 }, "ao": { "start": 81.15, "end": 82.17 }, "ou": { "start": 83.31, "end": 84.25 }, "ia": { "start": 85.98, "end": 86.98 }, "ie": { "start": 88.31, "end": 89.24 }, "iao": { "start": 90.88, "end": 91.82 }, "iu": { "start": 93.24, "end": 94.26 }, "ua": { "start": 95.8, "end": 96.75 }, "uo": { "start": 98.12, "end": 99.08 }, "uai": { "start": 100.61, "end": 101.6 }, "ui": { "start": 103.66, "end": 104.68 }, "üe": { "start": 106.52, "end": 107.54 }, "an": { "start": 110.11, "end": 111.09 }, "en": { "start": 112.62, "end": 113.55 }, "in": { "start": 114.94, "end": 115.88 }, "un": { "start": 117.25, "end": 118.09 }, "ün": { "start": 119.72, "end": 120.57 }, "ian": { "start": 122.77, "end": 123.68 }, "uan": { "start": 125.49, "end": 126.37 }, "üan": { "start": 128.12, "end": 128.99 }, "ang": { "start": 131.23, "end": 132.01 }, "eng": { "start": 133.56, "end": 134.45 }, "ing": { "start": 136.27, "end": 137.19 }, "ong": { "start": 138.87, "end": 139.69 }, "iang": { "start": 141.73, "end": 142.6 }, "iong": { "start": 144.33, "end": 145.24 }, "uang": { "start": 147.07, "end": 147.99 }, "ueng": { "start": 149.44, "end": 150.33 }
});

                const initialsData = {
                    "唇音": ["b", "p", "m", "f"], "舌尖音": ["d", "t", "n", "l"],
                    "舌根音": ["g", "k", "h"], "舌面音": ["j", "q", "x"],
                    "翹舌音": ["zh", "ch", "sh", "r"], "平舌音": ["z", "c", "s"], "其他": ["y", "w"]
                };

                const finalsData = {
                    "單韻母及特殊": ["a", "o", "e", "i", "u", "ü",  "er"],
                    "複韻母":[ "ai", "ei", "ao", "ou", "ia", "ie", "iao", "iu", "ua", "uo", "uai", "ui", "üe" ],
                    "前鼻韻母": ["an", "en", "in", "un", "ün", "ian", "uan", "üan"],
                    "後鼻韻母": ["ang", "eng", "ing", "ong", "iang", "iong", "uang","ueng"]
                };

                let currentAudioTrackListener = null;

                const playSound = (key) => {
                    const data = timelineData.value[key];
                    if (data && audioPlayer.value) {
                        if (isFullPlaying.value) { audioPlayer.value.pause(); isFullPlaying.value = false; }
                        if (currentAudioTrackListener) { audioPlayer.value.removeEventListener('timeupdate', currentAudioTrackListener); }
                        audioPlayer.value.currentTime = data.start;
                        audioPlayer.value.play().catch(err => console.log("音頻播放需要用戶手勢觸發", err));
                        const checkEnd = () => {
                            if (audioPlayer.value.currentTime >= data.end) {
                                audioPlayer.value.pause();
                                audioPlayer.value.removeEventListener('timeupdate', checkEnd);
                                currentAudioTrackListener = null;
                            }
                        };
                        currentAudioTrackListener = checkEnd;
                        audioPlayer.value.addEventListener('timeupdate', checkEnd);
                    }
                };

                const toggleFullAudio = () => {
                    if (!audioPlayer.value) return;
                    if (currentAudioTrackListener) { audioPlayer.value.removeEventListener('timeupdate', currentAudioTrackListener); currentAudioTrackListener = null; }
                    if (isFullPlaying.value) { audioPlayer.value.pause(); isFullPlaying.value = false; } 
                    else {
                        if (audioPlayer.value.ended || audioPlayer.value.currentTime >= audioPlayer.value.duration) audioPlayer.value.currentTime = 0;
                        audioPlayer.value.play(); isFullPlaying.value = true;
                    }
                };

                const goToCombination = (group) => {
                    if (combinationUrls[group]) {
                        window.location.href = combinationUrls[group];
                    }
                };

                const startRecordingList = () => {
                    const list = [];
                    Object.values(initialsData).flat().forEach(s => { list.push({ id: s, start: 0, end: 0 }); });
                    Object.values(finalsData).flat().forEach(y => { list.push({ id: y, start: 0, end: 0 }); });
                    devMarkers.value = list; currentMarkerIndex.value = 0;
                };

                const exportData = () => {
                    const result = {};
                    devMarkers.value.forEach(m => { if(m.end > 0) result[m.id] = { start: Number(m.start.toFixed(3)), end: Number(m.end.toFixed(3)) }; });
                    navigator.clipboard.writeText(JSON.stringify(result, null, 2)).then(() => alert("✅ 數據已複製！"));
                };

                onMounted(() => {
                    if (audioPlayer.value) audioPlayer.value.addEventListener('ended', () => isFullPlaying.value = false);
                    window.addEventListener('keydown', (e) => {
                        if (e.ctrlKey && e.key === 'm') devMode.value = !devMode.value;
                    });
                });

                return {
                    audioPlayer, currentTab, initialsData, finalsData, playSound, toggleFullAudio, isFullPlaying,
                    goToCombination, devMode, devMarkers, currentMarkerIndex, startRecordingList, exportData
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
