<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>漢語拼音互動實驗室</title>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f8fafc;
      color: #334155;
    }

    .pinyin-display {
      font-family: Arial, sans-serif;
    }

    .neumorphic-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    .dev-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      color: white;
      padding: 20px;
      z-index: 1000;
      max-height: 40vh;
      overflow-y: auto;
      font-family: monospace;
      border-top: 4px solid #f59e0b;
      box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.3);
    }

    .marker-active {
      background: #f59e0b !important;
      color: #000 !important;
      font-weight: bold;
      border-color: white !important;
      transform: scale(1.05);
    }

    .marker-done {
      opacity: 0.4;
      background: #334155;
    }

    button,
    div {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body class="p-3 sm:p-6">
  <div id="app" class="max-w-4xl mx-auto pb-32">

    <audio
      ref="audioPlayer"
      src="pinyin_elements.mp3"
      preload="auto"
      class="hidden"
    ></audio>

    <header class="space-y-6 mb-6">
      <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4">

        <!-- 左上方區域：保留版權提示，僅隱藏音頻按鈕 -->
        <div class="space-y-2">

          <!-- 播放完整音頻按鈕：目前隱藏 -->
          <button
            @click="toggleFullAudio"
            :class="isFullPlaying
              ? 'bg-amber-600 hover:bg-amber-700'
              : 'bg-slate-700 hover:bg-slate-800'"
            class="w-full md:w-auto text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors flex items-center justify-center gap-2 active:scale-98 hidden"
          >
            <span>
              {{ isFullPlaying ? '⏸️ 暫停完整音頻' : '▶️ 播放完整聲韻母音頻' }}
            </span>
          </button>

          <!-- 版權提示 -->
          <div class="text-[11px] text-slate-400 leading-relaxed font-medium pl-1">
            <p>錄音僅供參考。網頁僅供機構內部使用。</p>
            <p>© 普通話水平測試中心版權所有。</p>
          </div>
        </div>

        <!-- 聲母／韻母切換 -->
        <div class="flex rounded-xl bg-slate-200/70 p-1 w-full md:w-auto shadow-inner ml-auto">
          <button
            @click="currentTab = 'initial'"
            :class="currentTab === 'initial'
              ? 'bg-white text-emerald-800 font-extrabold shadow-md'
              : 'text-slate-600'"
            class="flex-1 md:flex-none md:px-8 py-2.5 text-sm sm:text-base rounded-lg transition-all active:scale-95"
          >
            基礎聲母 (23)
          </button>

          <button
            @click="currentTab = 'final'"
            :class="currentTab === 'final'
              ? 'bg-white text-blue-800 font-extrabold shadow-md'
              : 'text-slate-600'"
            class="flex-1 md:flex-none md:px-8 py-2.5 text-sm sm:text-base rounded-lg transition-all active:scale-95"
          >
            韻母 (39)
          </button>
        </div>
      </div>

      <h1 class="text-center text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-wider py-2">
        漢語拼音互動實驗室
      </h1>

      <!-- 拼讀網頁導航 -->
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-7 gap-2 text-center">

          <button
            @click="goToCombination('bpmf')"
            class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95"
          >
            bpmf 拼讀
          </button>

          <button
            @click="goToCombination('dtnl')"
            class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95"
          >
            dtnl 拼讀
          </button>

          <button
            @click="goToCombination('gkh')"
            class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95"
          >
            gkh 拼讀
          </button>

          <button
            @click="goToCombination('jqx')"
            class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95"
          >
            jqx 拼讀
          </button>

          <button
            @click="goToCombination('zhchshr')"
            class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95"
          >
            翹舌音拼讀
          </button>

          <button
            @click="goToCombination('zcs')"
            class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95"
          >
            平舌音拼讀
          </button>

          <button
            @click="goToCombination('yw')"
            class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition-colors active:scale-95"
          >
            零聲母/yw
          </button>

        </div>
      </div>
    </header>

    <main class="space-y-6">

      <!-- 聲母內容 -->
      <div
        v-if="currentTab === 'initial'"
        class="neumorphic-card p-4 sm:p-6 border border-emerald-100"
      >
        <h2 class="text-sm sm:text-base font-bold text-emerald-700 mb-4 flex items-center">
          <span class="mr-2">🟢</span>
          點擊聲母聽發音 (共 23 個)
        </h2>

        <div
          v-for="(group, name) in initialsData"
          :key="name"
          class="mb-6 last:mb-0"
        >
          <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider pl-1">
            {{ name }}
          </p>

          <div class="grid grid-cols-4 sm:grid-cols-6 gap-2.5 sm:gap-4">
            <button
              v-for="s in group"
              :key="s"
              @click="playSound(s)"
              class="py-3 sm:py-4 rounded-xl border bg-slate-50 text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-300 transition-all font-bold text-xl sm:text-2xl pinyin-display shadow-sm active:scale-90"
            >
              {{ s }}
            </button>
          </div>
        </div>
      </div>

      <!-- 韻母內容 -->
      <div
        v-if="currentTab === 'final'"
        class="neumorphic-card p-4 sm:p-6 border border-blue-100"
      >
        <h2 class="text-sm sm:text-base font-bold text-blue-700 mb-4 flex items-center">
          <span class="mr-2">🔵</span>
          點擊韻母聽發音 (共 39 個)
        </h2>

        <div
          v-for="(group, name) in finalsData"
          :key="name"
          class="mb-6 last:mb-0"
        >
          <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider pl-1">
            {{ name }}
          </p>

          <div class="grid grid-cols-3 sm:grid-cols-5 gap-2.5 sm:gap-4">
            <button
              v-for="y in group"
              :key="y"
              @click="playSound(y)"
              class="py-3 sm:py-4 rounded-xl border bg-slate-50 text-slate-700 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 transition-all font-bold text-lg sm:text-xl pinyin-display shadow-sm active:scale-90"
            >
              {{ y }}
            </button>
          </div>
        </div>
      </div>

    </main>

    <!-- 開發者錄音標記面板 -->
    <div v-if="devMode" class="dev-panel">
      <div class="sticky top-0 bg-[#0f172a] pb-4 mb-4 border-b border-slate-700">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-orange-400 font-bold text-sm">
            基礎元素錄音標記助手
          </h2>

          <div class="space-x-2">
            <button
              @click="startRecordingList"
              class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs font-bold transition-colors"
            >
              1. 生成清單
            </button>

            <button
              @click="exportData"
              class="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-xs font-bold transition-colors"
            >
              2. 複製數據
            </button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-6 sm:grid-cols-8 gap-1 text-[10px]">
        <div
          v-for="(m, i) in devMarkers"
          :key="i"
          :id="'marker-' + i"
          class="p-1 border border-slate-700 rounded transition-all text-center"
          :class="{
            'marker-active': currentMarkerIndex === i,
            'marker-done': i < currentMarkerIndex
          }"
        >
          <span class="block opacity-40">
            #{{ i + 1 }}
          </span>

          <span class="text-xs font-bold pinyin-display">
            {{ m.id }}
          </span>
        </div>
      </div>
    </div>

    <!-- 「即將上線」提示彈窗 -->
    <div
      v-if="showComingSoonModal"
      class="fixed inset-0 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity duration-300"
    >
      <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center transform transition-all duration-300 scale-100">

        <div class="w-14 h-14 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
          🔔
        </div>

        <h3 class="text-lg font-bold text-slate-800 mb-2">
          即將上線
        </h3>

        <p class="text-sm text-slate-500 leading-relaxed mb-6">
          本頁面內容即將上線，敬請留意。
        </p>

        <button
          @click="showComingSoonModal = false"
          class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl transition-all active:scale-95 text-sm"
        >
          我知道了
        </button>

      </div>
    </div>

  </div>

  <script>
    const {
      createApp,
      ref,
      onMounted
    } = Vue;

    createApp({
      setup() {
        const audioPlayer = ref(null);
        const currentTab = ref('initial');
        const isFullPlaying = ref(false);

        // 控制「即將上線」彈窗
        const showComingSoonModal = ref(false);

        // 拼讀網頁網址
        const combinationUrls = {
          bpmf: 'https://yangjingjing2019-lang.github.io/bpmf/',
          dtnl: 'https://yangjingjing2019-lang.github.io/dtnl/',
          gkh: 'https://yangjingjing2019-lang.github.io/gkh/',
          jqx: 'https://yangjingjing2019-lang.github.io/jqx/',
          zhchshr: 'https://yangjingjing2019-lang.github.io/zhchshr/',
          zcs: 'https://yangjingjing2019-lang.github.io/zcs/',
          yw: ''
        };

        const devMode = ref(false);
        const devMarkers = ref([]);
        const currentMarkerIndex = ref(0);

        const timelineData = ref({
          "b": { "start": 2.15, "end": 3.04 },
          "p": { "start": 4.42, "end": 5.36 },
          "m": { "start": 6.88, "end": 7.83 },
          "f": { "start": 9.53, "end": 10.41 },

          "d": { "start": 12.65, "end": 13.58 },
          "t": { "start": 15.11, "end": 16.04 },
          "n": { "start": 17.70, "end": 18.66 },
          "l": { "start": 20.33, "end": 21.25 },

          "g": { "start": 23.24, "end": 24.10 },
          "k": { "start": 25.54, "end": 26.55 },
          "h": { "start": 28.06, "end": 29.01 },

          "j": { "start": 30.58, "end": 31.60 },
          "q": { "start": 32.50, "end": 33.63 },
          "x": { "start": 34.70, "end": 35.92 },

          "zh": { "start": 38.23, "end": 39.19 },
          "ch": { "start": 40.47, "end": 41.54 },
          "sh": { "start": 42.64, "end": 43.81 },
          "r": { "start": 45.14, "end": 46.08 },

          "z": { "start": 47.55, "end": 48.41 },
          "c": { "start": 49.67, "end": 50.65 },
          "s": { "start": 51.72, "end": 52.82 },

          "y": { "start": 53.89, "end": 54.87 },
          "w": { "start": 55.84, "end": 56.82 },

          "a": { "start": 59.90, "end": 60.93 },
          "o": { "start": 62.21, "end": 63.27 },
          "e": { "start": 64.62, "end": 65.63 },
          "i": { "start": 66.90, "end": 67.95 },
          "u": { "start": 69.05, "end": 70.09 },
          "ü": { "start": 71.44, "end": 72.45 },
          "er": { "start": 74.07, "end": 75.07 },

          "ai": { "start": 76.83, "end": 77.96 },
          "ei": { "start": 78.90, "end": 79.97 },
          "ao": { "start": 80.95, "end": 82.17 },
          "ou": { "start": 83.11, "end": 84.25 },

          "ia": { "start": 85.78, "end": 86.98 },
          "ie": { "start": 88.11, "end": 89.24 },
          "iao": { "start": 90.68, "end": 91.82 },
          "iu": { "start": 93.04, "end": 94.26 },

          "ua": { "start": 95.60, "end": 96.75 },
          "uo": { "start": 97.92, "end": 99.08 },
          "uai": { "start": 100.41, "end": 101.60 },
          "ui": { "start": 103.46, "end": 104.68 },
          "üe": { "start": 106.32, "end": 107.54 },

          "an": { "start": 109.91, "end": 111.09 },
          "en": { "start": 112.42, "end": 113.55 },
          "in": { "start": 114.74, "end": 115.88 },
          "un": { "start": 117.05, "end": 118.09 },
          "ün": { "start": 119.52, "end": 120.57 },

          "ian": { "start": 122.57, "end": 123.68 },
          "uan": { "start": 125.29, "end": 126.37 },
          "üan": { "start": 127.92, "end": 128.99 },

          "ang": { "start": 131.03, "end": 132.01 },
          "eng": { "start": 133.36, "end": 134.45 },
          "ing": { "start": 136.07, "end": 137.19 },
          "ong": { "start": 138.67, "end": 139.69 },

          "iang": { "start": 141.53, "end": 142.60 },
          "iong": { "start": 144.13, "end": 145.24 },
          "uang": { "start": 146.87, "end": 147.99 },
          "ueng": { "start": 149.24, "end": 150.33 }
        });

        const initialsData = {
          "唇音": ["b", "p", "m", "f"],
          "舌尖音": ["d", "t", "n", "l"],
          "舌根音": ["g", "k", "h"],
          "舌面音": ["j", "q", "x"],
          "翹舌音": ["zh", "ch", "sh", "r"],
          "平舌音": ["z", "c", "s"],
          "其他": ["y", "w"]
        };

        const finalsData = {
          "單韻母及特殊韻母": [
            "a", "o", "e", "i", "u", "ü", "er"
          ],

          "複韻母": [
            "ai", "ei", "ao", "ou",
            "ia", "ie", "iao", "iu",
            "ua", "uo", "uai", "ui", "üe"
          ],

          "前鼻韻母": [
            "an", "en", "in", "un",
            "ün", "ian", "uan", "üan"
          ],

          "後鼻韻母": [
            "ang", "eng", "ing", "ong",
            "iang", "iong", "uang", "ueng"
          ]
        };

        let currentAudioTrackListener = null;

        const playSound = (key) => {
          const data = timelineData.value[key];

          if (data && audioPlayer.value) {
            if (isFullPlaying.value) {
              audioPlayer.value.pause();
              isFullPlaying.value = false;
            }

            if (currentAudioTrackListener) {
              audioPlayer.value.removeEventListener(
                'timeupdate',
                currentAudioTrackListener
              );

              currentAudioTrackListener = null;
            }

            audioPlayer.value.currentTime = data.start;

            audioPlayer.value.play().catch((err) => {
              console.log('音頻播放需要用戶手勢觸發', err);
            });

            const checkEnd = () => {
              if (audioPlayer.value.currentTime >= data.end) {
                audioPlayer.value.pause();

                audioPlayer.value.removeEventListener(
                  'timeupdate',
                  checkEnd
                );

                currentAudioTrackListener = null;
              }
            };

            currentAudioTrackListener = checkEnd;

            audioPlayer.value.addEventListener(
              'timeupdate',
              checkEnd
            );
          }
        };

        const toggleFullAudio = () => {
          if (!audioPlayer.value) {
            return;
          }

          if (currentAudioTrackListener) {
            audioPlayer.value.removeEventListener(
              'timeupdate',
              currentAudioTrackListener
            );

            currentAudioTrackListener = null;
          }

          if (isFullPlaying.value) {
            audioPlayer.value.pause();
            isFullPlaying.value = false;
          } else {
            if (
              audioPlayer.value.ended ||
              audioPlayer.value.currentTime >= audioPlayer.value.duration
            ) {
              audioPlayer.value.currentTime = 0;
            }

            audioPlayer.value.play().catch((err) => {
              console.log('音頻播放需要用戶手勢觸發', err);
            });

            isFullPlaying.value = true;
          }
        };

        /**
         * 已設定網址：直接進入網頁
         * 尚未設定網址：顯示「即將上線」
         */
        const goToCombination = (group) => {
          const targetUrl = combinationUrls[group];

          if (targetUrl) {
            window.location.href = targetUrl;
          } else {
            showComingSoonModal.value = true;
          }
        };

        const startRecordingList = () => {
          const list = [];

          Object.values(initialsData)
            .flat()
            .forEach((s) => {
              list.push({
                id: s,
                start: 0,
                end: 0
              });
            });

          Object.values(finalsData)
            .flat()
            .forEach((y) => {
              list.push({
                id: y,
                start: 0,
                end: 0
              });
            });

          devMarkers.value = list;
          currentMarkerIndex.value = 0;
        };

        const exportData = () => {
          const result = {};

          devMarkers.value.forEach((m) => {
            if (m.end > 0) {
              result[m.id] = {
                start: Number(m.start.toFixed(3)),
                end: Number(m.end.toFixed(3))
              };
            }
          });

          navigator.clipboard
            .writeText(JSON.stringify(result, null, 2))
            .then(() => {
              alert('✅ 數據已複製！');
            })
            .catch((err) => {
              console.error('複製數據失敗：', err);
              alert('無法自動複製，請檢查瀏覽器權限。');
            });
        };

        onMounted(() => {
          if (audioPlayer.value) {
            audioPlayer.value.addEventListener('ended', () => {
              isFullPlaying.value = false;
            });
          }

          window.addEventListener('keydown', (event) => {
            if (
              event.ctrlKey &&
              event.key.toLowerCase() === 'm'
            ) {
              devMode.value = !devMode.value;
            }
          });
        });

        return {
          audioPlayer,
          currentTab,
          initialsData,
          finalsData,
          playSound,
          toggleFullAudio,
          isFullPlaying,
          goToCombination,
          devMode,
          devMarkers,
          currentMarkerIndex,
          startRecordingList,
          exportData,
          showComingSoonModal
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
